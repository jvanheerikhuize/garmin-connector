[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "garmin-connector"
version = "0.1.0"
description = "Garmin Connector (Lean MVP) - Connect to watch and ingest/map GPX/FIT."
readme = "README.md"
authors = [{ name = "Jerry van Heerikhuize" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "gpxpy>=1.6.0",
    "fitparse>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
garmin-connector = "garmin_connector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["garmin_connector*"]
