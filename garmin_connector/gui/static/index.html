<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Garmin Connector MVP</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { font-family: sans-serif; margin: 0; padding: 20px; background: #1e1e2e; color: #cdd6f4; }
    .container { max-width: 900px; margin: auto; }
    .card { background: #313244; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
    h1, h2 { margin-top: 0; }
    #map { height: 400px; width: 100%; border-radius: 8px; margin-top: 10px; background: #45475a; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid #45475a; }
    button { background: #89b4fa; color: #11111b; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; }
    button:hover { background: #74c7ec; }
    .status-indicator { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #f38ba8; margin-right: 5px; }
    .status-indicator.connected { background: #a6e3a1; }
    #dropZone { border: 2px dashed #89b4fa; padding: 40px; text-align: center; border-radius: 8px; margin-bottom: 20px; cursor: pointer; }
    #dropZone.hover { background: #45475a; }
    a { color: #89b4fa; cursor: pointer; text-decoration: underline; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1><span id="statusDot" class="status-indicator"></span> Garmin Connector MVP</h1>
      <p id="deviceStatus">No device connected. Please plug in your Garmin watch.</p>
    </div>

    <div class="card">
      <h2>Ingest GPX Route</h2>
      <div id="dropZone">
        <p>Drop a GPX file here to sideload, or click to select.</p>
        <input type="file" id="fileInput" accept=".gpx" style="display: none;" />
      </div>
    </div>

    <div class="card">
      <h2>Courses on Watch</h2>
      <button onclick="fetchCourses()">Refresh List</button>
      <table>
        <thead><tr><th>Filename</th><th>Size</th><th>Location</th><th>Action</th></tr></thead>
        <tbody id="courseTableBody"><tr><td colspan="4">No courses loaded</td></tr></tbody>
      </table>
    </div>

    <div class="card">
      <h2>Map Preview</h2>
      <p id="mapInfo">Select a .gpx course from the watch to preview.</p>
      <div id="map"></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
