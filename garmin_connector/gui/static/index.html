<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Garmin Connector</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="app-container">
    <nav class="navbar">
      <div class="navbar-brand">Garmin Connector</div>
      <div class="device-status-container">
        <span id="statusDot" class="status-indicator"></span>
        <span id="deviceStatus">Connecting...</span>
      </div>
    </nav>

    <div class="main-content">
      <div class="sidebar">
        <div class="card" style="margin-bottom: 20px;">
          <div class="card-header">
            <h2>Sideload Route</h2>
          </div>
          <div id="dropZone" class="dropzone">
            <p>Drop GPX here or click</p>
            <input type="file" id="fileInput" accept=".gpx" style="display: none;" />
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <h2>Courses on Watch</h2>
            <button id="btnRefresh" class="btn btn-primary btn-small" onclick="fetchCourses()" disabled>Refresh</button>
          </div>
          <div id="courseTableBody" class="course-list">
            <div class="empty-state">No courses loaded</div>
          </div>
        </div>
      </div>

      <div class="maparea">
        <div class="card" style="flex: 1; display: flex; flex-direction: column;">
          <h2>Map Preview</h2>
          <div id="map" style="flex: 1; border-radius: var(--radius-md); box-shadow: inset 0 0 20px rgba(0, 240, 255, 0.1);"></div>
          <p id="mapInfo" style="margin-top: 12px; font-size: 0.9rem; color: var(--text-muted);">Select a course to preview</p>
        </div>
      </div>
    </div>
  </div>

  <div id="confirmModal" class="modal-backdrop hidden">
    <div class="modal-dialog" style="max-width: 400px;">
      <div class="modal-header">
        <div class="modal-title-group">
          <div class="modal-title">Confirm Deletion</div>
          <div class="modal-subtitle" id="confirmModalText">Are you sure you want to delete this course?</div>
        </div>
        <button class="btn btn-text modal-close" id="confirmModalClose">✕</button>
      </div>
      <div class="modal-body" style="padding: 20px; display: flex; gap: 12px; justify-content: flex-end;">
        <button id="btnConfirmCancel" class="btn btn-secondary">Cancel</button>
        <button id="btnConfirmDelete" class="btn btn-danger">Delete</button>
      </div>
    </div>
  </div>

  <div id="toastContainer" class="toast-container"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
