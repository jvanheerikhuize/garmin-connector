[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "garmin-connector"
version = "1.0.0"
description = "Connect to a Garmin Venu watch over USB, ingest GPX routes as FIT courses, and manage them from a local web GUI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fitparse",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
garmin-connector = "garmin_connector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"garmin_connector.gui" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
