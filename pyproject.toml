[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "garmin-connector"
version = "0.1.0"
description = "Sideload and manage hiking & cycling routes (GPX/FIT) on Garmin Venu and other Garmin watches."
readme = "README.md"
authors = [{ name = "Jerry van Heerikhuize" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0.0",
    "gpxpy>=1.6.0",
    "watchdog>=4.0.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "python-multipart>=0.0.9",
]
cloud = [
    "garminconnect>=0.2.0",
]
all = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "python-multipart>=0.0.9",
    "garminconnect>=0.2.0",
    "pytest>=8.0.0",
]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
garmin-connector = "garmin_connector.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["garmin_connector*"]
