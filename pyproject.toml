[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "garmin-connector"
version = "1.0.0"
description = "A lightweight tool to connect to a Garmin Venu over USB."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fitparse",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
garmin-connector = "garmin_connector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
